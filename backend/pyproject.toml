[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lpu-research-hub-backend"
version = "0.1.0"
description = "Backend API for the LPU Research Intelligence & Collaboration Hub (prototype)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pyjwt>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "email-validator>=2.2,<3.0",
    # Recommendations (Step 9): TF-IDF + cosine similarity, run locally.
    "scikit-learn>=1.6,<2.0",
    "numpy>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.15,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a running PostgreSQL test database (TEST_DATABASE_URL)",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

# scikit-learn ships no type stubs; this is scoped to that import only, not
# a blanket relaxation.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
