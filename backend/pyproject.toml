[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lpu-research-hub-backend"
version = "0.1.0"
description = "Backend API for the LPU Research Intelligence & Collaboration Hub (prototype)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pyjwt>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "email-validator>=2.2,<3.0",
    # Recommendations (Step 9): TF-IDF + cosine similarity, run locally.
    "scikit-learn>=1.6,<2.0",
    "numpy>=2.1,<3.0",
    # Deadline reminders (Step 12): in-process scheduler, no broker.
    "apscheduler>=3.11,<4.0",
    # The embeddings table has a `vector` column in every install, so the
    # SQLAlchemy type that maps it is needed to import the models at all —
    # even when the optional model below isn't installed. Small and pure
    # Python; the heavy part of semantic search is the `ml` extra.
    "pgvector>=0.3,<1.0",
    # Profile import (ORCID / OpenAlex / Crossref / Semantic Scholar): the
    # connectors make outbound HTTPS calls, so httpx is a runtime dependency,
    # not just the test client it used to be.
    "httpx>=0.28,<1.0",
    # Publication de-duplication: token-set ratio over normalised titles, to
    # score the shortlist that pg_trgm generates. Pure wheels, no native build.
    "rapidfuzz>=3.10,<4.0",
    # The institutional research report exports to PDF. Pure Python wheels, no
    # system libraries, so it installs on a slim container the same as locally.
    "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
# Semantic search (Step 13). Optional on purpose: the app runs without it and
# falls back to the Step 9 lexical/structured matching.
ml = [
    "sentence-transformers>=3.3,<6.0",
]
dev = [
    "pytest>=8.3,<10.0",
    # scripts/export_seed_record.py writes the XLSX record of what a seed
    # created. A tooling dependency, never imported by the application.
    "openpyxl>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.15,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a running PostgreSQL test database (TEST_DATABASE_URL)",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

# scikit-learn ships no type stubs, and sentence-transformers is an optional
# extra that isn't installed in every environment (it is imported lazily, and
# the code already handles its absence). Scoped to these imports, not a
# blanket relaxation.
[[tool.mypy.overrides]]
module = ["sklearn.*", "apscheduler.*", "sentence_transformers.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
