server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for the app shell. The API sets its own (see
    # backend/app/core/security_headers.py).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # style-src allows inline styles because chart and layout libraries set
    # element styles directly; scripts stay strictly same-origin.
    # connect-src must list the API origin: set API_ORIGIN when templating
    # this file, or edit it for your deployment.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Hashed assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
