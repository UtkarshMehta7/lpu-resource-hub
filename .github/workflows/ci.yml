name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch cancels the run it supersedes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's image, because migration 0013 enables the extension and
        # `vector` is not a trusted extension a plain owner can create.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lpu_hub
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: lpu_research_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lpu_hub -d lpu_research_hub"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lpu_hub:devpassword123@localhost:5432/lpu_research_hub
      TEST_DATABASE_URL: postgresql+psycopg://lpu_hub:devpassword123@localhost:5432/lpu_research_hub_test
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create the test database and enable pgvector
        run: |
          PGPASSWORD=devpassword123 psql -h localhost -U lpu_hub -d lpu_research_hub \
            -c "CREATE DATABASE lpu_research_hub_test"
          for db in lpu_research_hub lpu_research_hub_test; do
            PGPASSWORD=devpassword123 psql -h localhost -U lpu_hub -d "$db" \
              -c "CREATE EXTENSION IF NOT EXISTS vector"
          done

      - name: Install
        working-directory: backend
        # Without the ML extra: semantic search degrades cleanly, and those
        # tests skip themselves. The `semantic` job below installs it.
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: backend
        run: mypy

      - name: Tests
        working-directory: backend
        run: pytest -q

      - name: Migrations are reversible and match the models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  semantic:
    name: Backend with the optional ML extra
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lpu_hub
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: lpu_research_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lpu_hub -d lpu_research_hub"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lpu_hub:devpassword123@localhost:5432/lpu_research_hub
      TEST_DATABASE_URL: postgresql+psycopg://lpu_hub:devpassword123@localhost:5432/lpu_research_hub_test
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create the test database and enable pgvector
        run: |
          PGPASSWORD=devpassword123 psql -h localhost -U lpu_hub -d lpu_research_hub \
            -c "CREATE DATABASE lpu_research_hub_test"
          for db in lpu_research_hub lpu_research_hub_test; do
            PGPASSWORD=devpassword123 psql -h localhost -U lpu_hub -d "$db" \
              -c "CREATE EXTENSION IF NOT EXISTS vector"
          done

      - name: Install with the ML extra
        working-directory: backend
        run: pip install -e ".[dev,ml]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Semantic tests
        working-directory: backend
        run: pytest -q tests/test_semantic_search.py tests/test_recommendation_scoring.py

  frontend:
    name: Frontend (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --run
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The browser flows are slower and need both halves running, so they are
    # opt-in: they run on main and on a PR labelled "e2e".
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lpu_hub
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: lpu_research_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lpu_hub -d lpu_research_hub"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lpu_hub:devpassword123@localhost:5432/lpu_research_hub
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      VITE_API_BASE_URL: http://localhost:8000
      E2E_PASSWORD: ci-seed-password-123

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Enable pgvector
        run: |
          PGPASSWORD=devpassword123 psql -h localhost -U lpu_hub -d lpu_research_hub \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Prepare the backend and seed fictional demo data
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          SEED_DEMO_PASSWORD="$E2E_PASSWORD" python -m scripts.seed_demo_data

      - name: Install the frontend and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the flows
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
